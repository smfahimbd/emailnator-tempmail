<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Emailnator</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%); min-height: 100vh; padding: 0; margin: 0; }
    .container { width: 100%; height: 100vh; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 32px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; flex-shrink: 0; }
    .header .email-info { flex: 1; min-width: 200px; }
    .header h1 { font-size: 1.8em; font-weight: 700; margin-bottom: 8px; }
    .header .email { font-size: 1em; opacity: 0.9; word-break: break-all; font-weight: 400; }
    .header .back-button { background: rgba(255, 255, 255, 0.2); color: white; padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; font-weight: 600; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    .header .back-button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
    .content { padding: 40px; flex: 1; overflow-y: auto; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .refresh-button { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    .refresh-button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
    .refresh-button:active { transform: translateY(0); }
    .loading { text-align: center; padding: 48px 24px; color: #64748b; }
    .loading-spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fef2f2; color: #991b1b; padding: 16px; border-radius: 12px; margin: 16px 0; border: 1px solid #fecaca; font-size: 0.95em; }
    .message-list { display: grid; gap: 10px; }
    .message-item { background: #ffffff; padding: 13px 16px; border-radius: 9px; border: 1px solid #e5e7eb; cursor: pointer; transition: all 0.2s ease; position: relative; display: flex; align-items: center; gap: 16px; min-height: 50px; }
    .message-item:hover { background: #f5f7ff; border-color: #c7d2fe; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.12); transform: translateY(-1px); }
    .message-item.locked { background: #fef2f2; opacity: 0.7; cursor: not-allowed; }
    .message-item .from { order: 1; width: 140px; flex-shrink: 0; color: #475569; font-size: 0.86em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .message-item h4 { order: 2; flex: 1; min-width: 0; margin: 0; margin-left: 20px; color: #111827; font-size: 0.95em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .message-item .time { order: 3; margin-left: auto; width: 80px; flex-shrink: 0; text-align: right; color: #6366f1; font-size: 0.8em; font-weight: 600; white-space: nowrap; }
    .message-item .checkbox { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .message-item .star { font-size: 1.2em; color: #cbd5e1; flex-shrink: 0; }
    .message-item .content { flex: 1; min-width: 0; }
    .no-messages { text-align: center; padding: 48px 24px; color: #64748b; }
    .no-messages .icon { font-size: 3em; margin-bottom: 16px; }
    @media (max-width: 768px) {
        .container { height: auto; min-height: 100vh; }
        .header { padding: 24px 20px; flex-direction: column; text-align: center; }
        .header .email-info { min-width: 100%; }
        .header h1 { font-size: 1.3em; }
        .header .email { font-size: 0.85em; }
        .content { padding: 20px; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .refresh-button { justify-content: center; }
        .message-item { flex-direction: column; align-items: flex-start; padding: 16px; gap: 8px; min-height: auto; }
        .message-item .from { order: 1; width: 100%; font-size: 0.9em; margin-bottom: 4px; }
        .message-item h4 { order: 2; width: 100%; margin: 0; font-size: 0.95em; margin-bottom: 4px; }
        .message-item .time { order: 3; width: 100%; text-align: left; font-size: 0.85em; }
    }
    @media (max-width: 480px) {
        .header h1 { font-size: 1.2em; }
        .message-item { padding: 14px 12px; }
        .message-item .from { font-size: 0.85em; }
        .message-item h4 { font-size: 0.9em; }
        .message-item .time { font-size: 0.8em; }
    }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="email-info">
                <h1>📥 Inbox</h1>
                <div class="email" id="emailAddress"></div>
            </div>
            <a href="/" class="back-button">
                ← Back to Home
            </a>
        </div>

        <div class="content">
            <div class="toolbar">
                <button class="refresh-button" onclick="loadMessages()">
                    🔄 Refresh Messages
                </button>
            </div>

            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                Loading messages...
            </div>
            <div id="error" class="error" style="display: none;"></div>

            <div id="messageList" class="message-list"></div>
        </div>
    </div>

    <script>
        const email = decodeURIComponent(window.location.pathname.split('/inbox/')[1]);

        document.getElementById('emailAddress').textContent = email;

        function loadMessages() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('messageList').innerHTML = '';

            fetch(`/api/message-list/${encodeURIComponent(email)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.success) {
                        displayMessages(data.data.messages);
                    } else {
                        showError(data.error);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    showError('Failed to load messages: ' + error.message);
                });
        }

        function displayMessages(messages) {
            const container = document.getElementById('messageList');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-messages">
                        <div class="icon">📭</div>
                        <p>No messages found</p>
                    </div>
                `;
                return;
            }

            messages.forEach(message => {
                const item = document.createElement('div');
                item.className = 'message-item' + (message.locked ? ' locked' : '');
                item.innerHTML = `
                    <div class="from">${message.from}</div>
                    <h4>${message.subject}</h4>
                    <div class="time">${message.time_ago}</div>
                `;

                if (!message.locked) {
                    item.onclick = () => {
                        window.location.href = `/inbox/${encodeURIComponent(email)}/${encodeURIComponent(message.id)}`;
                    };
                }

                container.appendChild(item);
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';

            if (message.includes('temporarily unavailable')) {
                const retryButton = document.createElement('button');
                retryButton.textContent = '🔄 Retry';
                retryButton.className = 'refresh-button';
                retryButton.style.marginTop = '12px';
                retryButton.onclick = loadMessages;
                errorDiv.appendChild(retryButton);
            }
        }

        loadMessages();
    </script>
</body>

</html>

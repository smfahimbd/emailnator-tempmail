<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emailnator - Temporary Email Service</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%); min-height: 100vh; padding: 0; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 100%; height: 100vh; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 32px 40px; text-align: center; flex-shrink: 0; }
    .header h1 { font-size: 2.2em; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
    .header p { font-size: 1.1em; opacity: 0.9; font-weight: 400; }
    .controls { padding: 40px; background: #f8fafc; flex: 1; overflow-y: auto; }
    .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; max-width: 1400px; margin: 0 auto; }
    .section-title { text-align: center; margin-bottom: 32px; color: #1e293b; font-size: 1.5em; font-weight: 600; }
    .email-types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .email-type-card { background: #ffffff; padding: 24px 16px; border-radius: 16px; border: 2px solid #e2e8f0; cursor: pointer; transition: all 0.25s ease; text-align: center; position: relative; overflow: hidden; }
    .email-type-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); opacity: 0; transition: opacity 0.25s ease; }
    .email-type-card:hover { border-color: #6366f1; transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.3); }
    .email-type-card:hover::before { opacity: 0.05; }
    .email-type-card h3 { color: #1e293b; margin-bottom: 8px; font-size: 1.1em; font-weight: 600; position: relative; }
    .email-type-card p { color: #64748b; font-size: 0.85em; position: relative; }
    .email-type-card .icon { font-size: 2em; margin-bottom: 12px; position: relative; }
    .result-container { position: sticky; top: 20px; }
    .loading { text-align: center; padding: 32px; color: #64748b; font-size: 1em; display: none; }
    .loading.show { display: block; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fef2f2; color: #991b1b; padding: 16px; border-radius: 12px; margin-top: 16px; border: 1px solid #fecaca; display: none; font-size: 0.95em; }
    .error.show { display: block; }
    .success { background: #ffffff; color: #166534; padding: 28px 24px; border-radius: 16px; margin-top: 16px; text-align: center; border: 1px solid #c7d2fe; display: none; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.12); }
    .success.show { display: block; }
    .success h3 { font-size: 1.1em; font-weight: 600; margin-bottom: 16px; color: #334155; }
    .success .email { font-size: 1.25em; font-weight: 700; color: #4f46e5; margin: 12px 0; word-break: break-all; background: #f5f7ff; padding: 14px 16px; border-radius: 10px; border: 1px solid #c7d2fe; }
    .success .button { margin-top: 16px; }
    .success a { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    .success a:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
    @media (max-width: 768px) {
        .container { height: auto; min-height: 100vh; }
        .header { padding: 24px 20px; }
        .header h1 { font-size: 1.5em; }
        .header p { font-size: 0.95em; }
        .controls { padding: 24px 20px; }
        .main-content { grid-template-columns: 1fr; gap: 24px; }
        .email-types { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .email-type-card { padding: 20px 16px; }
        .section-title { font-size: 1.1em; }
        .success .email { font-size: 1.1em; padding: 10px 12px; }
        .result-container { position: static; }
    }
    @media (max-width: 480px) {
        .header h1 { font-size: 1.3em; }
        .header p { font-size: 0.9em; }
        .email-types { grid-template-columns: 1fr; }
        .email-type-card { padding: 16px 12px; }
        .success { padding: 20px 16px; }
    }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📧 Emailnator</h1>
            <p>Temporary Email Service</p>
        </div>

        <div class="controls">
            <h2 class="section-title">Choose Email Type</h2>

            <div class="main-content">
                <div class="email-types">
                    <div class="email-type-card" onclick="generateEmail(1)">
                        <div class="icon">🌐</div>
                        <h3>Domain</h3>
                        <p>Standard domain email</p>
                    </div>

                    <div class="email-type-card" onclick="generateEmail(2)">
                        <div class="icon">➕</div>
                        <h3>+Gmail</h3>
                        <p>Gmail with plus sign</p>
                    </div>

                    <div class="email-type-card" onclick="generateEmail(3)">
                        <div class="icon">📮</div>
                        <h3>.Gmail</h3>
                        <p>Gmail with dot</p>
                    </div>

                    <div class="email-type-card" onclick="generateEmail(4)">
                        <div class="icon">📬</div>
                        <h3>GoogleMail</h3>
                        <p>GoogleMail format</p>
                    </div>
                </div>

                <div class="result-container">
                    <div class="loading" id="loading">
                        <div class="loading-spinner"></div>
                        Generating email...
                    </div>
                    <div class="error" id="error"></div>
                    <div class="success" id="success">
                        <h3>Email Generated Successfully!</h3>
                        <div class="email" id="emailAddress"></div>
                        <div class="button">
                            <a id="inboxLink" href="#">
                                Check Inbox →
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showError(message) {
            const errorDisplay = document.getElementById('error');
            errorDisplay.textContent = message;
            errorDisplay.classList.add('show');
            setTimeout(() => errorDisplay.classList.remove('show'), 5000);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
            document.getElementById('success').classList.remove('show');
        }

        function generateEmail(type) {
            showLoading(true);

            fetch('/api/generate-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emailType: type })
            })
                .then(response => response.json())
                .then(data => {
                    showLoading(false);
                    if (data.success) {
                        const email = data.data.email;
                        document.getElementById('emailAddress').textContent = email;
                        document.getElementById('inboxLink').href = `/inbox/${encodeURIComponent(email)}`;
                        document.getElementById('success').classList.add('show');
                    } else {
                        showError(data.error);
                    }
                })
                .catch(error => {
                    showLoading(false);
                    showError('Failed to generate email: ' + error.message);
                });
        }
    </script>
</body>

</html>
